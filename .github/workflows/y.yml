name: Orpheus Irssi Check
on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:

jobs:
  check-irc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Irssi
        run: sudo apt-get update && sudo apt-get install -y weechat-headless

      - name: Run Check
        run: |
          chmod +x bash.sh
          ./bash.sh
